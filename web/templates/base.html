<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIPMI — Sistem Pengaduan & Bantuan PMI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        merah:   { DEFAULT: '#C8102E', 600: '#B00E28', 700: '#9B0E22', 50: '#FCEDEE' },
                        ink:     { DEFAULT: '#16213E', 700: '#1F2A4A', 500: '#3A4663' },
                        cream:   '#FBF8F3',
                        gold:    '#C9A227',
                    },
                    fontFamily: {
                        sans:    ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        display: ['Fraunces', 'Georgia', 'serif'],
                    },
                    boxShadow: {
                        card: '0 1px 2px rgba(22,33,62,.04), 0 12px 32px -12px rgba(22,33,62,.12)',
                    },
                },
            },
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .batik-line { background-image: repeating-linear-gradient(45deg, rgba(200,16,46,.06) 0 2px, transparent 2px 9px); }
        [x-cloak] { display: none; }
    </style>
</head>
<body class="bg-cream text-ink font-sans antialiased">
    {% block shell %}{% endblock %}

    {# ---- Flash messages ---- #}
    {% if flashes %}
    <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 w-[min(92vw,360px)]" id="flash-stack">
        {% for f in flashes %}
        <div class="flex items-start gap-3 rounded-xl border px-4 py-3 shadow-card animate-[slidein_.3s_ease]
            {% if f.kind == 'error' %}bg-merah-50 border-merah/30 text-merah-700{% else %}bg-white border-emerald-200 text-emerald-800{% endif %}">
            <span class="mt-0.5 text-lg leading-none">{% if f.kind == 'error' %}&#9888;{% else %}&#10003;{% endif %}</span>
            <p class="text-sm font-medium flex-1">{{ f.msg }}</p>
            <button onclick="this.parentElement.remove()" class="text-current/50 hover:text-current">&times;</button>
        </div>
        {% endfor %}
    </div>
    <style>@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}</style>
    <script>setTimeout(()=>{const s=document.getElementById('flash-stack');if(s)s.style.transition='opacity .5s',s.style.opacity='0',setTimeout(()=>s.remove(),500);},4500);</script>
    {% endif %}
</body>
</html>
